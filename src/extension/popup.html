<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      width: 250px;
      padding: 15px;
      font-family: sans-serif;
      background: #0f172a;
      color: white;
    }

    h2 {
      font-size: 16px;
      margin-top: 0;
      color: #38bdf8;
    }

    button {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    .status {
      margin-top: 10px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>

<body>
  <h2>Job Tracker</h2>
  <div style="margin-bottom: 10px;">
    <select id="statusSelect"
      style="width:100%; padding:8px; border-radius:6px; background:#1e293b; color:white; border:1px solid #334155;">
      <option value="wishlist">Bookmark (For later)</option>
      <option value="applied">Applied (I just applied)</option>
    </select>
  </div>
  <button id="saveBtn">Save this Job +</button>
  <div class="status" id="status">
    <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #eee;">
      <button id="syncBtn"
        style="background: #0077b5; width: 100%; border: none; color: white; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold;">
        Sync LinkedIn Profile
      </button>
    </div>

  </div>
  <script src="popup.js"></script>
</body>

</html>
