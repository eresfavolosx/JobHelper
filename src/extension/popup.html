<!DOCTYPE html>
<html>

<head>
  <style>
    /* Liquid Glass Palette Injection */
    :root {
      --bg-app: #0f172a;
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.7);
      --accent-primary: #0ea5e9;
      --accent-gradient: linear-gradient(135deg, #0ea5e9 0%, #8b5cf6 100%);
      --glass-panel: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
      --input-bg: rgba(0, 0, 0, 0.3);
      --input-focus: rgba(0, 0, 0, 0.5);
      --btn-secondary: rgba(255, 255, 255, 0.1);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-app: #f4f4f5;
        --text-primary: #09090b;
        --text-secondary: #52525b;
        --accent-primary: #0284c7;
        --accent-gradient: linear-gradient(135deg, #0284c7 0%, #7c3aed 100%);
        --glass-panel: rgba(255, 255, 255, 0.7);
        --glass-border: rgba(0, 0, 0, 0.1);
        --input-bg: rgba(0, 0, 0, 0.05);
        --input-focus: rgba(0, 0, 0, 0.1);
        --btn-secondary: rgba(0, 0, 0, 0.05);
      }
    }

    body {
      width: 340px;
      padding: 0;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-app);
      /* Fallback */
      color: var(--text-primary);
      overflow: hidden;
    }

    /* Aurora Background */
    .background-aurora {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 0% 0%, rgba(14, 165, 233, 0.15), transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(139, 92, 246, 0.15), transparent 50%);
      z-index: -1;
    }

    .container {
      padding: 20px;
      position: relative;
    }

    h2 {
      margin: 0 0 20px 0;
      font-size: 20px;
      font-weight: 800;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
    }

    input,
    select {
      width: 100%;
      padding: 10px;
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 13px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    input:focus,
    select:focus {
      border-color: var(--accent-primary);
      background: var(--input-focus);
    }

    .card {
      background: var(--glass-panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: var(--accent-gradient);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: transform 0.1s, opacity 0.2s;
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
    }

    button:hover {
      box-shadow: 0 6px 16px rgba(14, 165, 233, 0.5);
      transform: translateY(-1px);
    }

    button:active {
      transform: scale(0.98);
    }

    .key-input-wrapper {
      display: flex;
      gap: 8px;
    }

    #toggleKeyBtn {
      width: auto;
      padding: 0 12px;
      background: var(--btn-secondary);
      box-shadow: none;
      border: 1px solid var(--glass-border);
      font-size: 11px;
      color: var(--text-primary);
    }

    a {
      color: var(--accent-primary);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="background-aurora"></div>
  <div class="container">
    <h2>🚀 Save to JobTracker</h2>

    <div class="card" id="apiKeyContainer">
      <label for="apiKeyInput">Gemini API Key</label>
      <div class="key-input-wrapper">
        <input type="password" id="apiKeyInput" placeholder="Paste key..." />
        <button id="toggleKeyBtn">Show</button>
      </div>
      <p style="font-size: 11px; color: var(--text-secondary); text-align: center; margin-top: 16px;">
        <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener"
          style="color: var(--accent-primary);">Get your free API key</a>
      </p>
    </div>

    <div class="form-group" style="margin-bottom: 20px;">
      <label for="statusSelect">Initial Status</label>
      <select id="statusSelect">
        <option value="wishlist">Saved / Wishlist</option>
        <option value="applied">Applied</option>
        <option value="interviewing">Interviewing</option>
        <option value="offer">Offer</option>
        <option value="accepted">Accepted Offer</option>
      </select>
    </div>

    <button id="saveBtn">✨ Auto-Fill with AI</button>
  </div>
  <script src="popup.js"></script>
</body>

</html>
