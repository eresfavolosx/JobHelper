<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save to NovuJobs</title>
  <style>
    /* Architectural House Palette: Cotton & Slate Grey with Sage Accent */
    :root {
      --bg-app: #181C20;
      --text-primary: #FAF8F4;
      --text-secondary: #9DA7AE;
      --accent-primary: #6B7E67;
      --accent-secondary: #76858E;
      --accent-gradient: linear-gradient(135deg, #4A7C55 0%, #5F956B 100%);
      --glass-panel: rgba(33, 38, 44, 0.75);
      --glass-border: rgba(157, 167, 174, 0.16);
      --input-bg: rgba(0, 0, 0, 0.25);
      --input-focus: rgba(0, 0, 0, 0.45);
      --btn-secondary: rgba(157, 167, 174, 0.12);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-app: #F5F2EB;
        --text-primary: #22272B;
        --text-secondary: #58636B;
        --accent-primary: #3D6C48;
        --accent-secondary: #607079;
        --accent-gradient: linear-gradient(135deg, #366942 0%, #4D8259 100%);
        --glass-panel: rgba(255, 255, 255, 0.9);
        --glass-border: rgba(55, 66, 74, 0.12);
        --input-bg: rgba(0, 0, 0, 0.04);
        --input-focus: rgba(0, 0, 0, 0.08);
        --btn-secondary: rgba(55, 66, 74, 0.06);
      }
    }

    body {
      width: 350px;
      padding: 0;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-app);
      color: var(--text-primary);
      overflow-x: hidden;
    }

    /* Aurora Background */
    .background-aurora {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 0% 0%, rgba(74, 124, 85, 0.16), transparent 55%),
        radial-gradient(circle at 100% 100%, rgba(118, 133, 142, 0.14), transparent 55%);
      z-index: -1;
    }

    .container {
      padding: 18px;
      position: relative;
    }

    .header-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .header-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      flex-shrink: 0;
      box-shadow: 0 3px 8px rgba(74, 124, 85, 0.25);
    }

    h2 {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }

    .subtitle {
      margin: 2px 0 0 0;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .form-group {
      margin-bottom: 11px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    label {
      display: block;
      margin-bottom: 4px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
    }

    input,
    select {
      width: 100%;
      padding: 8px 10px;
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
      border-radius: 7px;
      color: var(--text-primary);
      font-size: 12.5px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    input:focus,
    select:focus {
      border-color: var(--accent-primary);
      background: var(--input-focus);
    }

    button {
      width: 100%;
      padding: 11px;
      background: var(--accent-gradient);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
      transition: transform 0.1s, opacity 0.2s;
      box-shadow: 0 4px 12px rgba(74, 124, 85, 0.28);
      margin-top: 4px;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:active {
      transform: scale(0.98);
    }

    .status-note {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 8px;
      text-align: center;
      min-height: 15px;
    }
    .select-wrapper {
      position: relative;
    }

    .select-wrapper select {
      appearance: none;
      -webkit-appearance: none;
      padding-right: 28px;
      cursor: pointer;
    }

    .select-chevron {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--text-secondary);
    }
  </style>
</head>

<body>
  <div class="background-aurora"></div>
  <div class="container">
    <div class="header-row">
      <div class="header-icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
          <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
        </svg>
      </div>
      <div>
        <h2>Save to NovuJobs</h2>
        <p class="subtitle">Verify &amp; clip clean job details</p>
      </div>
    </div>

    <div class="form-group">
      <label for="roleInput">Job Role / Title</label>
      <input type="text" id="roleInput" placeholder="e.g., Senior Frontend Engineer" autocomplete="off">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="companyInput">Company</label>
        <input type="text" id="companyInput" placeholder="e.g., Stripe" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="locationInput">Location</label>
        <input type="text" id="locationInput" placeholder="e.g., Remote / NYC" autocomplete="off">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="resumeUrlInput">Resume Link Used</label>
        <input type="url" id="resumeUrlInput" placeholder="https://docs.google.com/..." autocomplete="off">
      </div>
      <div class="form-group">
        <label for="resumeNameInput">Resume Label</label>
        <input type="text" id="resumeNameInput" placeholder="e.g., AI Resume v2" autocomplete="off">
      </div>
    </div>

    <div class="form-group">
      <label for="statusSelect">Application Stage</label>
      <div class="select-wrapper">
        <select id="statusSelect">
          <option value="wishlist">Saved / Wishlist</option>
          <option value="applied" selected>Applied</option>
          <option value="screening">Initial Screening</option>
          <option value="interviewing">Interviewing</option>
          <option value="offer">Offer</option>
          <option value="accepted">Accepted</option>
          <option value="rejected">Rejected</option>
        </select>
        <svg class="select-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
    </div>

    <button id="saveBtn" type="button">Save Job to Board</button>
    <div id="statusNote" class="status-note" role="status" aria-live="polite">Detecting job details from active tab...</div>
  </div>
  <script type="module" src="popup.js"></script>
</body>

</html>
