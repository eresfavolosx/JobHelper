<!DOCTYPE html>
<html>

<head>
  <style>
    /* Architectural House Palette: Cotton & Slate Grey with Sage Accent */
    :root {
      --bg-app: #181C20;
      --text-primary: #FAF8F4;
      --text-secondary: #9DA7AE;
      --accent-primary: #6B7E67;
      --accent-secondary: #76858E;
      --accent-gradient: linear-gradient(135deg, #4A7C55 0%, #5F956B 100%);
      --glass-panel: rgba(33, 38, 44, 0.75);
      --glass-border: rgba(157, 167, 174, 0.16);
      --input-bg: rgba(0, 0, 0, 0.25);
      --input-focus: rgba(0, 0, 0, 0.45);
      --btn-secondary: rgba(157, 167, 174, 0.12);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-app: #F5F2EB;
        --text-primary: #22272B;
        --text-secondary: #58636B;
        --accent-primary: #3D6C48;
        --accent-secondary: #607079;
        --accent-gradient: linear-gradient(135deg, #366942 0%, #4D8259 100%);
        --glass-panel: rgba(255, 255, 255, 0.9);
        --glass-border: rgba(55, 66, 74, 0.12);
        --input-bg: rgba(0, 0, 0, 0.04);
        --input-focus: rgba(0, 0, 0, 0.08);
        --btn-secondary: rgba(55, 66, 74, 0.06);
      }
    }

    body {
      width: 340px;
      padding: 0;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-app);
      /* Fallback */
      color: var(--text-primary);
      overflow: hidden;
    }

    /* Aurora Background */
    .background-aurora {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 0% 0%, rgba(14, 165, 233, 0.15), transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(139, 92, 246, 0.15), transparent 50%);
      z-index: -1;
    }

    .container {
      padding: 20px;
      position: relative;
    }

    h2 {
      margin: 0 0 20px 0;
      font-size: 20px;
      font-weight: 800;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
    }

    input,
    select {
      width: 100%;
      padding: 10px;
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 13px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    input:focus,
    select:focus {
      border-color: var(--accent-primary);
      background: var(--input-focus);
    }

    .card {
      background: var(--glass-panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: var(--accent-gradient);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: transform 0.1s, opacity 0.2s;
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
    }

    button:hover {
      box-shadow: 0 6px 16px rgba(14, 165, 233, 0.5);
      transform: translateY(-1px);
    }

    button:active {
      transform: scale(0.98);
    }

    .key-input-wrapper {
      display: flex;
      gap: 8px;
    }

    #toggleKeyBtn {
      width: auto;
      padding: 0 12px;
      background: var(--btn-secondary);
      box-shadow: none;
      border: 1px solid var(--glass-border);
      font-size: 11px;
      color: var(--text-primary);
    }

    a {
      color: var(--accent-primary);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="background-aurora"></div>
  <div class="container">
    <h2>🚀 Save to NovuJobs</h2>

    <div class="form-group" style="margin-bottom: 20px;">
      <label for="statusSelect">Initial Status</label>
      <select id="statusSelect">
        <option value="wishlist">Saved / Wishlist</option>
        <option value="applied">Applied</option>
        <option value="interviewing">Interviewing</option>
        <option value="offer">Offer</option>
        <option value="accepted">Accepted Offer</option>
      </select>
    </div>

    <button id="saveBtn">Save Job</button>
  </div>
  <script type="module" src="popup.js"></script>
</body>

</html>
